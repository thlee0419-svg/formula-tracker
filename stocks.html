<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📈 내 주식 계좌 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f3; --surface: #ffffff; --surface-muted: #f0efec;
    --border: rgba(0,0,0,0.1); --text: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --accent: #2a78d6;
    --up: #d93b3b;   /* 한국식: 상승=빨강 */
    --down: #2a6fd6; /* 하락=파랑 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --surface: #242422; --surface-muted: #2c2c2a;
      --border: rgba(255,255,255,0.1); --text: #f0efe9; --text-secondary: #b0afa8; --text-muted: #85847f;
      --accent: #4a90e2; --up: #ff6b6b; --down: #6aa6ff;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 1.25rem; }
  .up { color: var(--up); } .down { color: var(--down); }

  .banner { background: #fef3cd; border: 1px solid #f0c940; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: none; color: #7a5f00; }
  .banner.visible { display: block; }
  .banner p { font-size: 13px; margin-bottom: 8px; font-weight: 500; }
  .banner .row { display: flex; gap: 8px; }
  .banner input { flex: 1; padding: 8px 10px; border: 1px solid #f0c940; border-radius: 6px; font-size: 13px; background: #fff; color: #333; }
  .banner button { padding: 8px 14px; background: #f0c940; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; color: #5a4500; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .toolbar .group { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
  .toolbar input[type=number] { width: 90px; }
  td input.cur { width: 90px; }
  .sync { font-size: 12px; color: var(--text-muted); }
  .sync.error { color: var(--up); }

  input, select { width: 100%; padding: 8px 10px; border: 0.5px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--surface); color: var(--text); outline: none; min-width: 0; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,120,214,0.15); }
  .btn { padding: 8px 14px; background: var(--text); color: var(--surface); border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: var(--surface); color: var(--text); border: 0.5px solid var(--border); }
  .btn:hover { opacity: .8; }

  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .card-label { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: .6px; margin-bottom: 1rem; }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1rem; }
  .stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: .9rem 1rem; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .stat-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }

  .accounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1rem; }
  .acct { background: var(--surface); border: 0.5px solid var(--border); border-top: 3px solid var(--c); border-radius: 10px; padding: .9rem 1rem; cursor: pointer; }
  .acct.active { outline: 2px solid var(--c); }
  .acct-name { font-size: 14px; font-weight: 600; }
  .acct-role { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .acct-value { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .acct-line { font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .chart-wrap { position: relative; height: 240px; }

  .form-grid { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr) auto; gap: 8px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--text-muted); }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-weight: 500; color: var(--text-muted); padding: 6px 8px; border-bottom: 0.5px solid var(--border); font-size: 12px; white-space: nowrap; }
  td { text-align: right; padding: 8px; border-bottom: 0.5px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  tr:last-child td { border-bottom: none; }
  td input.cur { width: 90px; text-align: right; padding: 4px 6px; font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }
  .del { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 6px; }
  .del:hover { color: var(--up); }
  .empty { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 14px; line-height: 1.8; }
  .tag { font-size: 10px; color: var(--text-muted); border: 0.5px solid var(--border); border-radius: 99px; padding: 1px 6px; margin-left: 6px; }
  .tabs { display: flex; gap: 2px; border-bottom: 0.5px solid var(--border); margin-bottom: 1rem; flex-wrap: wrap; }
  .tab { font-size: 13px; font-weight: 500; color: var(--text-muted); padding: 7px 13px; border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }

  @media (max-width: 760px) {
    .summary, .accounts { grid-template-columns: 1fr 1fr; }
    .charts { grid-template-columns: 1fr; }
    .form-grid, .form-grid[style] { grid-template-columns: minmax(0,1fr) minmax(0,1fr) !important; }
    .form-grid .btn { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📈 내 주식 계좌 대시보드</h1>
  <p class="subtitle">NH · 삼성 · 미래에셋 · 신한 4개 계좌의 성과를 한눈에 확인하세요</p>

  <div class="banner" id="banner">
    <p>⚙️ Google Sheets 연동 URL을 입력해 주세요 (설정하면 모든 기기에서 데이터가 공유돼요). 연동 전에는 이 브라우저에만 저장됩니다.</p>
    <div class="row">
      <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec">
      <button onclick="saveUrl()">저장</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="group">
      <label for="rate">USD/KRW 환율</label>
      <input type="number" id="rate" min="0" step="0.1" onchange="setRate(this.value)">
      <span class="sync" id="sync"></span>
    </div>
    <div class="group">
      <button class="btn ghost" onclick="exportJson()">내보내기</button>
      <button class="btn ghost" onclick="document.getElementById('importFile').click()">가져오기</button>
      <button class="btn ghost" onclick="resetUrl()">시트 연동 설정</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJson(this)">
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="accounts" id="accounts"></div>

  <div class="charts">
    <div class="card"><div class="card-label">계좌별 평가금액 비중</div><div class="chart-wrap"><canvas id="pieChart" role="img" aria-label="계좌별 평가금액 비중 도넛 차트"></canvas></div></div>
    <div class="card"><div class="card-label">계좌별 총손익 (원)</div><div class="chart-wrap"><canvas id="barChart" role="img" aria-label="계좌별 손익 막대 차트"></canvas></div></div>
  </div>

  <div class="card">
    <div class="card-label">보유 종목 추가</div>
    <div class="form-grid">
      <div class="field"><label>계좌</label><select id="fAcct"></select></div>
      <div class="field"><label>종목명</label><input id="fName" placeholder="예: 삼성전자"></div>
      <div class="field"><label>티커(선택)</label><input id="fTicker" placeholder="005930"></div>
      <div class="field"><label>수량</label><input type="number" id="fQty" min="0" step="any"></div>
      <div class="field"><label>평균 매수가</label><input type="number" id="fAvg" min="0" step="any"></div>
      <div class="field"><label>현재가</label><input type="number" id="fCur" min="0" step="any"></div>
      <button class="btn" onclick="addHolding()">추가</button>
    </div>
  </div>

  <div class="card">
    <div class="tabs" id="tabs"></div>
    <div class="table-scroll" id="holdings"></div>
  </div>

  <div class="card">
    <div class="card-label">실현손익 기록 (매도 완료분)</div>
    <div class="form-grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr) auto">
      <div class="field"><label>계좌</label><select id="rAcct"></select></div>
      <div class="field"><label>날짜</label><input type="date" id="rDate"></div>
      <div class="field"><label>종목/메모</label><input id="rName" placeholder="예: 엔비디아 일부 매도"></div>
      <div class="field"><label id="rAmtLabel">손익 금액</label><input type="number" id="rAmt" step="any" placeholder="손실은 음수"></div>
      <button class="btn" onclick="addRealized()">추가</button>
    </div>
    <div class="table-scroll" id="realized" style="margin-top:1rem"></div>
  </div>
</div>

<script>
const ACCOUNTS = [
  { id:'nh',      name:'NH증권',     role:'국내 중장기 스윙', cur:'KRW', color:'#2a78d6' },
  { id:'samsung', name:'삼성증권',   role:'장기투자',         cur:'KRW', color:'#1baf7a' },
  { id:'mirae',   name:'미래에셋증권', role:'단기 트레이딩',   cur:'KRW', color:'#eda100' },
  { id:'shinhan', name:'신한증권',   role:'미국주식',         cur:'USD', color:'#8a6ae0' },
];
const ACCT = Object.fromEntries(ACCOUNTS.map(a => [a.id, a]));
const LS_KEY = 'stockDashboardState', LS_URL = 'stockDashboardUrl';

let state = { rate: 1400, holdings: [], realized: [] };
let SCRIPT_URL = localStorage.getItem(LS_URL) || '';
let filter = 'all', pie = null, bar = null, saveTimer = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const toKRW = (v, acctId) => ACCT[acctId].cur === 'USD' ? v * state.rate : v;
const fmtKRW = v => Math.round(v).toLocaleString('ko-KR') + '원';
const fmtNum = (v, cur) => cur === 'USD' ? '$' + v.toLocaleString('en-US', {maximumFractionDigits:2}) : Math.round(v).toLocaleString('ko-KR');
const fmtPct = v => (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const signKRW = v => (v > 0 ? '+' : v < 0 ? '-' : '') + Math.abs(Math.round(v)).toLocaleString('ko-KR') + '원';
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- 저장 / 동기화 ---------- */
function setSync(msg, err) { const el = document.getElementById('sync'); el.textContent = msg; el.className = 'sync' + (err ? ' error' : ''); }

function persist() {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  if (!SCRIPT_URL) return;
  clearTimeout(saveTimer);
  setSync('저장 중...');
  saveTimer = setTimeout(async () => {
    try {
      await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body: JSON.stringify({ action:'save', state }) });
      setSync('시트에 저장됨 ✓'); setTimeout(() => setSync(''), 2000);
    } catch (e) { setSync('시트 저장 실패 (이 브라우저에는 저장됨)', true); }
  }, 600);
}

async function load() {
  try { const local = JSON.parse(localStorage.getItem(LS_KEY)); if (local) state = { ...state, ...local }; } catch (e) {}
  render();
  if (!SCRIPT_URL) { document.getElementById('banner').classList.add('visible'); return; }
  setSync('불러오는 중...');
  try {
    const res = await fetch(`${SCRIPT_URL}?action=load`);
    const data = await res.json();
    if (data && data.state) { state = { ...state, ...data.state }; localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    setSync('');
  } catch (e) { setSync('시트 불러오기 실패. 이 브라우저의 저장본을 표시합니다.', true); }
  render();
}

function saveUrl() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url.startsWith('https://script.google.com')) { alert('올바른 URL이 아닙니다.'); return; }
  SCRIPT_URL = url; localStorage.setItem(LS_URL, url);
  document.getElementById('banner').classList.remove('visible');
  load();
}
function resetUrl() { document.getElementById('urlInput').value = SCRIPT_URL; document.getElementById('banner').classList.add('visible'); }

function exportJson() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type:'application/json' }));
  a.download = `stocks-${new Date().toISOString().slice(0,10)}.json`; a.click();
}
function importJson(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.holdings) || !Array.isArray(d.realized)) throw 0;
      if (!confirm('현재 데이터를 가져온 파일로 덮어쓸까요?')) return;
      state = { rate: Number(d.rate) || 1400, holdings: d.holdings, realized: d.realized };
      persist(); render();
    } catch (e) { alert('올바른 백업 파일이 아닙니다.'); }
    input.value = '';
  };
  r.readAsText(f);
}

/* ---------- 데이터 조작 ---------- */
function setRate(v) { const n = Number(v); if (n > 0) { state.rate = n; persist(); render(); } }

function addHolding() {
  const acct = document.getElementById('fAcct').value;
  const name = document.getElementById('fName').value.trim();
  const ticker = document.getElementById('fTicker').value.trim();
  const qty = parseFloat(document.getElementById('fQty').value);
  const avg = parseFloat(document.getElementById('fAvg').value);
  let cur = parseFloat(document.getElementById('fCur').value);
  if (!name || !(qty > 0) || !(avg >= 0)) { alert('종목명, 수량, 평균 매수가를 입력해 주세요.'); return; }
  if (!(cur >= 0)) cur = avg;
  state.holdings.push({ id: uid(), account: acct, name, ticker, qty, avg, cur });
  ['fName','fTicker','fQty','fAvg','fCur'].forEach(i => document.getElementById(i).value = '');
  persist(); render();
}
function updateCur(id, v) {
  const h = state.holdings.find(x => x.id === id); const n = parseFloat(v);
  if (h && n >= 0) { h.cur = n; persist(); render(); }
}
function delHolding(id) {
  if (!confirm('이 종목을 삭제할까요?')) return;
  state.holdings = state.holdings.filter(h => h.id !== id); persist(); render();
}
function addRealized() {
  const account = document.getElementById('rAcct').value;
  const date = document.getElementById('rDate').value;
  const name = document.getElementById('rName').value.trim();
  const amount = parseFloat(document.getElementById('rAmt').value);
  if (!date || isNaN(amount)) { alert('날짜와 손익 금액을 입력해 주세요.'); return; }
  state.realized.push({ id: uid(), account, date, name, amount });
  document.getElementById('rName').value = ''; document.getElementById('rAmt').value = '';
  persist(); render();
}
function delRealized(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  state.realized = state.realized.filter(r => r.id !== id); persist(); render();
}
function setFilter(f) { filter = f; render(); }

/* ---------- 계산 ---------- */
function compute() {
  const per = Object.fromEntries(ACCOUNTS.map(a => [a.id, { value:0, cost:0, realized:0 }]));
  state.holdings.forEach(h => {
    if (!per[h.account]) return;
    per[h.account].value += toKRW(h.qty * h.cur, h.account);
    per[h.account].cost  += toKRW(h.qty * h.avg, h.account);
  });
  state.realized.forEach(r => { if (per[r.account]) per[r.account].realized += toKRW(r.amount, r.account); });
  const total = { value:0, cost:0, realized:0 };
  Object.values(per).forEach(p => { p.unreal = p.value - p.cost; p.ret = p.cost ? p.unreal / p.cost * 100 : 0; for (const k in total) total[k] += p[k]; });
  total.unreal = total.value - total.cost; total.ret = total.cost ? total.unreal / total.cost * 100 : 0;
  return { per, total };
}

/* ---------- 렌더링 ---------- */
function render() {
  const { per, total } = compute();
  document.getElementById('rate').value = state.rate;

  const fill = (id) => { const s = document.getElementById(id); if (!s.options.length) s.innerHTML = ACCOUNTS.map(a => `<option value="${a.id}">${a.name} (${a.role})</option>`).join(''); };
  fill('fAcct'); fill('rAcct');
  const rd = document.getElementById('rDate'); if (!rd.value) rd.value = new Date().toISOString().slice(0,10);

  const totalPnl = total.unreal + total.realized;
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="stat-label">총 평가금액</div><div class="stat-value">${fmtKRW(total.value)}</div><div class="stat-sub" style="color:var(--text-muted)">투자원금 ${fmtKRW(total.cost)}</div></div>
    <div class="stat"><div class="stat-label">평가손익</div><div class="stat-value ${cls(total.unreal)}">${signKRW(total.unreal)}</div><div class="stat-sub ${cls(total.unreal)}">${fmtPct(total.ret)}</div></div>
    <div class="stat"><div class="stat-label">실현손익</div><div class="stat-value ${cls(total.realized)}">${signKRW(total.realized)}</div></div>
    <div class="stat"><div class="stat-label">총손익 (평가+실현)</div><div class="stat-value ${cls(totalPnl)}">${signKRW(totalPnl)}</div></div>`;

  document.getElementById('accounts').innerHTML = ACCOUNTS.map(a => {
    const p = per[a.id];
    return `<div class="acct ${filter === a.id ? 'active' : ''}" style="--c:${a.color}" onclick="setFilter('${a.id}')">
      <div class="acct-name">${a.name}</div><div class="acct-role">${a.role}</div>
      <div class="acct-value">${fmtKRW(p.value)}</div>
      <div class="acct-line ${cls(p.unreal)}">${signKRW(p.unreal)} (${fmtPct(p.ret)})</div>
      <div class="acct-line">실현 <span class="${cls(p.realized)}">${signKRW(p.realized)}</span></div>
      <div class="acct-line">비중 ${total.value ? (p.value / total.value * 100).toFixed(1) : '0.0'}%</div>
    </div>`;
  }).join('');

  renderCharts(per);
  renderHoldings();
  renderRealized();
}

function renderCharts(per) {
  const tc = cssVar('--text-muted'), surface = cssVar('--surface');
  if (typeof Chart === 'undefined') return;
  const labels = ACCOUNTS.map(a => a.name), colors = ACCOUNTS.map(a => a.color);
  if (pie) pie.destroy(); if (bar) bar.destroy();
  pie = new Chart(document.getElementById('pieChart'), {
    type:'doughnut',
    data:{ labels, datasets:[{ data: ACCOUNTS.map(a => Math.round(per[a.id].value)), backgroundColor: colors, borderColor: surface, borderWidth: 2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'60%',
      plugins:{ legend:{ position:'bottom', labels:{ color: tc, boxWidth:10, font:{size:11} } }, tooltip:{ callbacks:{ label: c => ` ${c.label}: ${fmtKRW(c.raw)}` } } } }
  });
  bar = new Chart(document.getElementById('barChart'), {
    type:'bar',
    data:{ labels, datasets:[
      { label:'평가손익', data: ACCOUNTS.map(a => Math.round(per[a.id].unreal)), backgroundColor: cssVar('--accent') },
      { label:'실현손익', data: ACCOUNTS.map(a => Math.round(per[a.id].realized)), backgroundColor: '#eda100' } ] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ color: tc, boxWidth:10, font:{size:11} } }, tooltip:{ callbacks:{ label: c => ` ${c.dataset.label}: ${signKRW(c.raw)}` } } },
      scales:{ x:{ grid:{display:false}, ticks:{ color: tc, font:{size:11} } },
               y:{ grid:{ color:'rgba(128,128,128,0.15)' }, ticks:{ color: tc, font:{size:11}, callback: v => (v/10000).toLocaleString('ko-KR') + '만' } } } }
  });
}

function renderHoldings() {
  const tabs = [{ id:'all', name:'전체' }, ...ACCOUNTS];
  document.getElementById('tabs').innerHTML = tabs.map(t => `<button class="tab ${filter === t.id ? 'active' : ''}" onclick="setFilter('${t.id}')">${t.name}</button>`).join('');
  const rows = state.holdings.filter(h => ACCT[h.account] && (filter === 'all' || h.account === filter));
  if (!rows.length) { document.getElementById('holdings').innerHTML = '<div class="empty">보유 종목이 없습니다.<br>위에서 종목을 추가해 보세요.</div>'; return; }
  const items = rows.map(h => {
    const a = ACCT[h.account], cost = h.qty * h.avg, val = h.qty * h.cur, pnl = val - cost, ret = cost ? pnl / cost * 100 : 0;
    return { h, a, cost, val, pnl, ret, valKRW: toKRW(val, h.account) };
  }).sort((x, y) => y.valKRW - x.valKRW);
  document.getElementById('holdings').innerHTML = `<table><thead><tr><th>계좌</th><th>종목</th><th>수량</th><th>평균매수가</th><th>현재가</th><th>평가금액</th><th>평가손익</th><th>수익률</th><th></th></tr></thead><tbody>` +
    items.map(({ h, a, val, pnl, ret }) => `<tr>
      <td><span class="dot" style="--c:${a.color}"></span>${a.name}</td>
      <td>${esc(h.name)}${h.ticker ? `<span class="tag">${esc(h.ticker)}</span>` : ''}</td>
      <td>${h.qty.toLocaleString('ko-KR', {maximumFractionDigits:4})}</td>
      <td>${fmtNum(h.avg, a.cur)}</td>
      <td><input class="cur" type="number" step="any" value="${h.cur}" onchange="updateCur('${h.id}', this.value)" aria-label="${esc(h.name)} 현재가"></td>
      <td>${fmtNum(val, a.cur)}</td>
      <td class="${cls(pnl)}">${(pnl > 0 ? '+' : '') + fmtNum(pnl, a.cur)}</td>
      <td class="${cls(ret)}">${fmtPct(ret)}</td>
      <td><button class="del" onclick="delHolding('${h.id}')" title="삭제">✕</button></td></tr>`).join('') + '</tbody></table>';
}

function renderRealized() {
  const rows = state.realized.filter(r => ACCT[r.account]).slice().sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById('rAmtLabel').textContent = '손익 금액 (신한은 USD)';
  if (!rows.length) { document.getElementById('realized').innerHTML = '<div class="empty">실현손익 기록이 없습니다.</div>'; return; }
  document.getElementById('realized').innerHTML = `<table><thead><tr><th>날짜</th><th>계좌</th><th style="text-align:left">종목/메모</th><th>손익</th><th></th></tr></thead><tbody>` +
    rows.map(r => { const a = ACCT[r.account];
      return `<tr><td>${esc(r.date)}</td><td style="text-align:left"><span class="dot" style="--c:${a.color}"></span>${a.name}</td><td style="text-align:left">${esc(r.name)}</td>
        <td class="${cls(r.amount)}">${(r.amount > 0 ? '+' : '') + fmtNum(r.amount, a.cur)}</td>
        <td><button class="del" onclick="delRealized('${r.id}')" title="삭제">✕</button></td></tr>`; }).join('') + '</tbody></table>';
}

load();
</script>
</body>
</html>
