<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="ledger.webmanifest">
<link rel="apple-touch-icon" href="icons/ledger-apple-touch.png">
<title>가계부</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f2f5f4; --surface:#fff; --muted-bg:#e8eeec; --border:rgba(0,0,0,.1);
    --text:#121716; --text2:#4a5552; --text3:#85908d;
    --accent:#0f766e; --accent-bg:#dcf3ef; --accent-text:#fff;
    --in:#2563eb; --in-bg:#e3ecfd; --out:#d63a2a; --out-bg:#fbeae7;
    --amber:#b86e00; --amber-bg:#fdf1dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121615; --surface:#1d2321; --muted-bg:#28302d; --border:rgba(255,255,255,.1);
      --text:#eef2f0; --text2:#b3bcb9; --text3:#7b8683;
      --accent:#4fd1c0; --accent-bg:#14302c; --accent-text:#08201c;
      --in:#7aa7ff; --in-bg:#1b2742; --out:#ff7a6b; --out-bg:#3a1f1b;
      --amber:#f0b44c; --amber-bg:#3a2d12; color-scheme:dark;
    }
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-text-size-adjust:100%; }
  button, input, select { font-family:inherit; font-size:16px; color:var(--text); }
  button { cursor:pointer; }
  .container { max-width:680px; margin:0 auto; padding:calc(.8rem + env(safe-area-inset-top)) 1rem calc(7.5rem + env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:22px; font-weight:700; }
  .sync { font-size:12px; color:var(--text3); min-height:18px; margin-bottom:.4rem; }
  .sync.error { color:var(--out); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:.9rem; }
  h2 { font-size:15px; font-weight:600; margin:1.2rem 0 .55rem; color:var(--text2); }
  .card h2:first-child { margin-top:0; }
  .muted { color:var(--text3); font-size:13px; }
  .empty { text-align:center; color:var(--text3); padding:1.6rem 0; font-size:14px; line-height:1.6; }

  .monthnav { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:.8rem; }
  .monthnav .label { font-size:18px; font-weight:700; min-width:140px; text-align:center; }
  .monthnav button { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:6px 12px; }

  .sum { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
  .sum div { min-width:0; }
  .sum small { display:block; font-size:12px; color:var(--text3); margin-bottom:2px; }
  .sum b { font-size:16px; white-space:nowrap; }
  .sum .in b { color:var(--in); } .sum .out b { color:var(--out); }

  .alert { border-radius:10px; padding:8px 12px; font-size:13px; margin-bottom:.5rem; line-height:1.5; }
  .alert.warn { background:var(--amber-bg); color:var(--amber); }
  .alert.over { background:var(--out-bg); color:var(--out); }

  .filters { display:flex; gap:6px; margin-bottom:.4rem; }
  .filters input[type=search] { flex:1; min-width:0; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 12px; }
  .tgl { border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:0 12px; }
  .tgl.on { background:var(--accent-bg); color:var(--accent); border-color:var(--accent); }
  .fsel { display:none; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:.5rem; }
  .fsel.show { display:grid; }
  .fsel select { border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 8px; min-width:0; }
  .resinfo { font-size:13px; color:var(--text2); margin:.2rem 0 .4rem; }

  .day { display:flex; justify-content:space-between; font-size:13px; color:var(--text3); margin:.9rem .2rem .3rem; }
  .group { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--border); padding:10px 12px; }
  .row:last-child { border-bottom:none; }
  .ico { flex:0 0 36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .mid { flex:1; min-width:0; }
  .mid b { display:block; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mid small { display:block; font-size:12px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .amt { font-weight:700; font-size:15px; white-space:nowrap; }
  .amt.in { color:var(--in); } .amt.out { color:var(--out); }
  .rec-badge { font-size:11px; background:var(--muted-bg); color:var(--text2); border-radius:6px; padding:0 5px; margin-left:4px; }

  .seg { display:flex; background:var(--muted-bg); border-radius:12px; padding:3px; margin-bottom:.8rem; }
  .seg button { flex:1; border:none; background:none; padding:8px 0; font-weight:600; border-radius:10px; color:var(--text2); }
  .seg button.on { background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .donutwrap { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .donutwrap svg { width:190px; height:190px; }
  .legend { width:100%; }
  .lg { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; border-bottom:1px solid var(--border); }
  .lg:last-child { border-bottom:none; }
  .dot { width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
  .lg .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lg .p { color:var(--text3); font-size:12px; width:42px; text-align:right; }
  .lg .v { font-weight:600; min-width:84px; text-align:right; }
  .trend svg { width:100%; height:auto; display:block; }
  .key { display:flex; gap:12px; justify-content:center; font-size:12px; color:var(--text2); margin-top:4px; }
  .key i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }

  .bar { height:8px; background:var(--muted-bg); border-radius:99px; overflow:hidden; margin:6px 0 4px; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .bar.warn > i { background:var(--amber); } .bar.over > i { background:var(--out); }
  .brow { padding:10px 0; border-bottom:1px solid var(--border); }
  .brow:last-child { border-bottom:none; }
  .bhead { display:flex; align-items:center; gap:8px; }
  .bhead .n { flex:1; font-weight:600; font-size:15px; min-width:0; }
  .bhead input { width:120px; text-align:right; border:1px solid var(--border); background:var(--bg); border-radius:8px; padding:6px 8px; font-size:15px; }
  .bsub { display:flex; justify-content:space-between; font-size:12px; color:var(--text3); }

  .list-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; }
  .list-item:last-child { border-bottom:none; }
  .list-item .mid small { white-space:normal; }
  .addbtn { width:100%; margin-top:.6rem; padding:11px; border:1.5px dashed var(--border); background:none; border-radius:12px; color:var(--text2); font-weight:600; }
  .btn { border:none; border-radius:12px; padding:12px 16px; font-weight:700; background:var(--muted-bg); }
  .btn.primary { background:var(--accent); color:var(--accent-text); }
  .btn.danger { background:var(--out-bg); color:var(--out); }
  .btnrow { display:flex; gap:8px; margin-top:.9rem; }
  .btnrow .btn { flex:1; }

  .nav { position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--border); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20; }
  .nav button { flex:1; border:none; background:none; padding:9px 0 8px; font-size:11px; color:var(--text3); display:flex; flex-direction:column; align-items:center; gap:2px; }
  .nav button span { font-size:20px; line-height:1; }
  .nav button.on { color:var(--accent); font-weight:700; }
  .fab { position:fixed; right:max(1rem, calc(50% - 340px + 1rem)); bottom:calc(70px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; border:none; background:var(--accent); color:var(--accent-text); font-size:30px; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:19; line-height:1; }

  #sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; z-index:40; }
  #sheet.show { display:flex; }
  .sheet-box { background:var(--surface); width:100%; max-width:680px; max-height:92vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom)); }
  .sheet-box h3 { font-size:18px; margin-bottom:.8rem; }
  .l { display:block; font-size:13px; color:var(--text2); margin:.8rem 0 .3rem; font-weight:600; }
  .inp { width:100%; border:1px solid var(--border); background:var(--bg); border-radius:10px; padding:11px 12px; }
  .amtinp { font-size:26px; font-weight:700; text-align:right; }
  .amtview { text-align:right; font-size:13px; color:var(--text3); min-height:18px; margin-top:2px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--border); background:var(--bg); border-radius:99px; padding:6px 11px; font-size:14px; }
  .chip.on { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:700; }
  .chip.sm { font-size:13px; padding:4px 9px; }
  .emojibox { max-height:240px; overflow-y:auto; border:1px solid var(--border); border-radius:12px; padding:8px; background:var(--bg); }
  .egrp { font-size:12px; color:var(--text3); margin:10px 0 4px; font-weight:600; }
  .egrp:first-child { margin-top:0; }
  .eb { font-size:22px; width:42px; height:42px; border:1px solid transparent; background:none; border-radius:10px; }
  .eb.on { background:var(--accent-bg); border-color:var(--accent); }
  .ecustom { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .eprev { flex:0 0 46px; height:46px; border-radius:12px; background:var(--accent-bg); display:flex; align-items:center; justify-content:center; font-size:26px; }
  .hint { font-size:12px; color:var(--text3); margin-top:.35rem; line-height:1.5; }

  #toast { position:fixed; left:50%; bottom:calc(130px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:rgba(20,20,20,.92); color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; max-width:90%; opacity:0; pointer-events:none; transition:opacity .25s; z-index:60; text-align:center; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div class="container">
  <header><h1>💰 가계부</h1></header>
  <div class="sync" id="sync"></div>
  <div id="app"></div>
</div>
<button class="fab" data-act="add" aria-label="내역 추가">＋</button>
<nav class="nav" id="nav"></nav>
<div id="sheet"><div class="sheet-box" id="sheetbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
const KEY = 'ledger.v1', LS_URL = 'ledger.url', LS_BASE = 'ledger.base', LS_DIRTY = 'ledger.dirty', LS_BACKUP = 'ledger.backup';
const PALETTE = ['#0f766e', '#2563eb', '#d97706', '#db2777', '#7c3aed', '#059669', '#dc2626', '#0891b2', '#65a30d', '#6b7280'];
const EMOJI_GROUPS = {
  '음식': ['🍚', '🍜', '🍣', '🍕', '🍔', '🍗', '🥩', '🍳', '🥗', '🍞', '🍰', '🍦', '🍺', '🍷', '🥤', '☕', '🧋', '🍎', '🥕', '🍱', '🥟', '🍲', '🌮', '🍿'],
  '교통·차량': ['🚌', '🚇', '🚕', '🚗', '⛽', '🚲', '🛵', '✈️', '🚄', '🚢', '🅿️', '🛣️', '🔧', '🛞'],
  '주거·생활': ['🏠', '🏢', '🔑', '💡', '🚿', '🧻', '🛋️', '🧹', '📶', '📱', '💻', '🛒', '🧺', '🪴', '🛏️', '🔥', '💧'],
  '쇼핑·패션': ['👕', '👖', '👗', '👟', '👜', '🕶️', '💄', '🎒', '🛍️', '⌚', '💍', '🧴', '✂️', '💇'],
  '건강·운동': ['💊', '🏥', '🦷', '👓', '💪', '🧘', '🏃', '🩺', '🏋️', '⛳', '🚴', '🏊'],
  '문화·여가': ['🎬', '🎮', '🎵', '🎤', '📺', '🎨', '🎭', '🎳', '⚽', '⛺', '🏖️', '🎡', '🎟️', '📷', '🎲', '🎣'],
  '교육·육아': ['📚', '✏️', '🎓', '🏫', '👶', '🍼', '🧸', '🖍️', '🎹', '🔬', '🌐', '📝', '🧩'],
  '반려·경조사': ['🐶', '🐱', '🐟', '🐹', '🌱', '💐', '🎁', '🎂', '💝', '🙏', '🕊️', '🎉', '🎄', '👪'],
  '수입·금융': ['💼', '💰', '💵', '💴', '💶', '💷', '💳', '🏦', '🏧', '📈', '🪙', '🧧', '🏆', '🤝', '🧾', '💎'],
  '기타': ['💸', '➕', '➖', '⭐', '❤️', '🔔', '📌', '🔖', '📦', '🧰', '🛡️', '⏰', '🌈', '🍀', '❓'],
};
const PAY_GROUPS = {
  '현금·계좌·카드': ['💵', '💴', '💶', '💷', '💳', '🏦', '🏧', '💰', '🪙', '👛', '💼', '🧾', '🔒', '💎'],
  '간편결제·기타': ['📱', '🌐', '🏪', '🛍️', '🛒', '🐷', '🏠', '🚌', '🎁', '⭐', '❤️', '🔖', '📦', '🔑'],
};
const PAY_DEFAULT = { cash: '💵', bank: '🏦', card: '💳' };
const payIcon = p => p.emoji || PAY_DEFAULT[p.kind] || '💳';
const firstChar = s => { s = String(s || '').trim(); if (!s) return ''; if (window.Intl && Intl.Segmenter) { const it = new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s)[Symbol.iterator]().next(); return it.done ? '' : it.value.segment; } return Array.from(s)[0]; };
function emojiPickerHTML(groups, sel) {
  return `<div class="emojibox">${Object.keys(groups).map(g => `<div class="egrp">${g}</div><div class="chips" style="gap:2px">${groups[g].map(e => `<button class="eb ${sel === e ? 'on' : ''}" data-act="femoji" data-e="${e}">${e}</button>`).join('')}</div>`).join('')}</div>
  <div class="ecustom"><span class="eprev" id="f-eprev">${esc(sel)}</span><input class="inp" id="f-ecustom" type="text" placeholder="원하는 이모지를 직접 입력 (키보드의 😀 사용)"></div>`;
}
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const monthOf = s => s.slice(0, 7);
const addMonth = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n - 1; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12 + 1; return y + '-' + pad(m); };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const live = a => a.filter(x => !x.d);
const num = v => { const n = parseInt(String(v == null ? '' : v).replace(/[^\d]/g, ''), 10); return isFinite(n) ? n : 0; };
const numS = v => { const s = String(v == null ? '' : v).trim(); return (/^[-−–]/.test(s) ? -1 : 1) * num(s); };   // 마이너스 허용
const fmtN = n => n ? n.toLocaleString('ko-KR') : '';
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ---------- 상태 ---------- */
function blank() {
  const out = [['식비', '🍚'], ['카페·간식', '☕'], ['교통', '🚌'], ['주거·통신', '🏠'], ['생활용품', '🛒'], ['의료·건강', '💊'], ['문화·여가', '🎬'], ['교육·육아', '📚'], ['경조사', '🎁'], ['기타', '💸']];
  const inc = [['급여', '💼'], ['부수입', '💰'], ['용돈', '🧧'], ['기타', '➕']];
  const mk = (arr, type) => arr.map(([name, emoji], i) => ({ id: `c_${type}_${i}`, type, name, emoji, color: i % PALETTE.length, u: 0 }));
  return {
    v: 1, updatedAt: 0, tx: [], budgets: [], rec: [],
    cats: [...mk(out, 'out'), ...mk(inc, 'in')],
    pays: [{ id: 'p_0', name: '현금', kind: 'cash', init: 0, u: 0 }, { id: 'p_1', name: '체크카드', kind: 'card', init: 0, u: 0 }, { id: 'p_2', name: '신용카드', kind: 'card', init: 0, u: 0 }, { id: 'p_3', name: '주계좌', kind: 'bank', init: 0, u: 0 }],
  };
}
function norm(s) {
  const b = blank();
  ['tx', 'budgets', 'rec', 'cats', 'pays'].forEach(k => { if (!Array.isArray(s[k])) s[k] = b[k]; });
  s.tx.forEach(t => { if (!Array.isArray(t.tags)) t.tags = []; });
  s.updatedAt = s.updatedAt || 0; return s;
}
function loadLocal() { try { const j = JSON.parse(lsGet(KEY)); if (j && Array.isArray(j.tx)) return norm(j); } catch (e) {} return null; }
let S = loadLocal() || blank();
let SYNC_URL = '';
function saveLocal() { lsSet(KEY, JSON.stringify(S)); }
function save() { S.updatedAt = Date.now(); saveLocal(); lsSet(LS_DIRTY, '1'); schedulePush(); }
function touch(o) { o.u = Date.now(); return o; }

const payNet = id => live(S.tx).filter(t => t.pay === id).reduce((x, t) => x + (t.type === 'in' ? t.amount : -t.amount), 0);
const payBalance = p => p.init + payNet(p.id);   // 시작 잔액 + 기록된 수입 - 지출
const catById = id => S.cats.find(c => c.id === id);
const payById = id => S.pays.find(p => p.id === id);
const catsOf = type => live(S.cats).filter(c => c.type === type);
const catName = id => { const c = catById(id); return c ? c.name : '(삭제된 항목)'; };
const catIcon = id => { const c = catById(id); return c ? c.emoji : '❔'; };
const catColor = id => { const c = catById(id); return c ? PALETTE[c.color % PALETTE.length] : '#9ca3af'; };
const payName = id => { const p = payById(id); return p ? p.name : '(삭제된 결제수단)'; };
const monthTx = ym => live(S.tx).filter(t => monthOf(t.date) === ym);

function sums(ym) {
  const r = { in: 0, out: 0, cat: {}, tag: {}, pay: {} };
  monthTx(ym).forEach(t => {
    r[t.type] += t.amount;
    if (t.type === 'out') {
      r.cat[t.cat] = (r.cat[t.cat] || 0) + t.amount;
      r.pay[t.pay] = (r.pay[t.pay] || 0) + t.amount;
      t.tags.forEach(g => { r.tag[g] = (r.tag[g] || 0) + t.amount; });
    }
  });
  return r;
}
const budgetOf = id => { const b = live(S.budgets).find(x => x.id === id); return b ? b.amount : 0; };
function setBudget(id, amount) {
  let b = S.budgets.find(x => x.id === id);
  if (!b) { if (!amount) return; b = { id }; S.budgets.push(b); }
  b.amount = amount; b.d = amount ? 0 : 1; touch(b); save();
}
function budgetState(spent, budget) { const r = budget ? spent / budget : 0; return r >= 1 ? 'over' : r >= .8 ? 'warn' : ''; }
function budgetAlerts(ym) {
  const s = sums(ym), list = [];
  const tb = budgetOf('total');
  if (tb) { const st = budgetState(s.out, tb); if (st) list.push({ st, msg: `전체 예산 ${st === 'over' ? '초과' : '80% 도달'} (${won(s.out)} / ${won(tb)})` }); }
  catsOf('out').forEach(c => { const b = budgetOf(c.id); if (!b) return; const sp = s.cat[c.id] || 0, st = budgetState(sp, b); if (st) list.push({ st, msg: `${c.emoji} ${c.name} 예산 ${st === 'over' ? '초과' : '80% 도달'} (${won(sp)} / ${won(b)})` }); });
  return list;
}

/* ---------- 반복 거래 ---------- */
function genRecurring() {
  const cur = monthOf(todayStr()), td = todayStr(), have = new Set(S.tx.map(t => t.id)); let changed = false;
  live(S.rec).forEach(r => {
    for (let ym = r.start; ym <= cur; ym = addMonth(ym, 1)) {
      const id = `r_${r.id}_${ym}`;
      if (have.has(id)) continue;
      const date = `${ym}-${pad(Math.min(r.day, daysIn(ym)))}`;
      if (date > td) continue;
      S.tx.push({ id, type: r.type, amount: r.amount, date, cat: r.cat, pay: r.pay, memo: r.memo, tags: r.tags.slice(), rid: r.id, u: Date.now() });
      have.add(id); changed = true;
    }
  });
  if (changed) save();
}

function allTags() { const c = {}; live(S.tx).forEach(t => t.tags.forEach(g => { c[g] = (c[g] || 0) + 1; })); return Object.keys(c).sort((a, b) => c[b] - c[a]); }
function renderList() {
  const q = ui.q.trim().toLowerCase();
  const items = monthTx(ui.ym).filter(t => {
    if (ui.ft && t.type !== ui.ft) return false;
    if (ui.fc && t.cat !== ui.fc) return false;

    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || (b.u || 0) - (a.u || 0));
  const filtered = q || ui.ft || ui.fc || ui.fp || ui.fg;
  let h = '';
  if (filtered) { const o = items.filter(t => t.type === 'out').reduce((x, t) => x + t.amount, 0), i = items.filter(t => t.type === 'in').reduce((x, t) => x + t.amount, 0); h += `<div class="resinfo">${items.length}건 · 수입 ${won(i)} · 지출 ${won(o)}</div>`; }

/* ---------- 통계 ---------- */
function statsHTML() {
  const s = sums(ui.ym), type = ui.st;
  const total = s[type], data = {};
  monthTx(ui.ym).filter(t => t.type === type).forEach(t => { data[t.cat] = (data[t.cat] || 0) + t.amount; });
  const rows = Object.keys(data).map(id => ({ id, v: data[id] })).sort((a, b) => b.v - a.v);
  let donut = '';
  if (total > 0) {
    const R = 40, C = 2 * Math.PI * R; let off = 0, seg = '';
    rows.forEach(r => { const len = r.v / total * C; seg += `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${catColor(r.id)}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off += len; });
    donut = `<div class="donutwrap"><svg viewBox="0 0 120 120">${seg}<text x="60" y="57" text-anchor="middle" font-size="7" fill="var(--text3)">${type === 'out' ? '총 지출' : '총 수입'}</text><text x="60" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="var(--text)">${total.toLocaleString('ko-KR')}</text></svg>
    <div class="legend">${rows.map(r => `<div class="lg"><span class="dot" style="background:${catColor(r.id)}"></span><span class="n">${esc(catIcon(r.id) + ' ' + catName(r.id))}</span><span class="p">${(r.v / total * 100).toFixed(0)}%</span><span class="v">${won(r.v)}</span></div>`).join('')}</div></div>`;
  } else donut = '<div class="empty">이 달 기록이 없어요</div>';

  const months = []; for (let i = 5; i >= 0; i--) months.push(addMonth(ui.ym, -i));
  const ms = months.map(m => ({ m, ...sums(m) })), max = Math.max(1, ...ms.map(x => Math.max(x.in, x.out)));
  let bars = '';
  ms.forEach((x, i) => {
    const bx = 8 + i * 48, hi = x.in / max * 90, ho = x.out / max * 90;
    bars += `<rect x="${bx}" y="${105 - hi}" width="16" height="${hi}" rx="3" fill="var(--in)"/><rect x="${bx + 18}" y="${105 - ho}" width="16" height="${ho}" rx="3" fill="var(--out)"/><text x="${bx + 17}" y="120" text-anchor="middle" font-size="9" fill="${x.m === ui.ym ? 'var(--text)' : 'var(--text3)'}" font-weight="${x.m === ui.ym ? 700 : 400}">${+x.m.slice(5)}월</text>`;
  });
  const tagRows = Object.keys(s.tag).map(g => ({ g, v: s.tag[g] })).sort((a, b) => b.v - a.v).slice(0, 8);
  const payRows = live(S.pays).map(p => {
    const spent = s.pay[p.id] || 0, bal = p.kind === 'card' ? null : payBalance(p);
    return { p, spent, bal };
  });
  return `<div class="seg"><button data-act="st" data-k="out" class="${type === 'out' ? 'on' : ''}">지출</button><button data-act="st" data-k="in" class="${type === 'in' ? 'on' : ''}">수입</button></div>
  <div class="card"><h2>카테고리별 ${type === 'out' ? '지출' : '수입'}</h2>${donut}</div>
  <div class="card trend"><h2>최근 6개월 추이</h2><svg viewBox="0 0 300 126">${bars}</svg><div class="key"><span><i style="background:var(--in)"></i>수입</span><span><i style="background:var(--out)"></i>지출</span></div></div>
  <div class="card"><h2>결제수단별 (이번 달 지출 · 현재 잔액)</h2>${payRows.map(r => `<div class="lg"><span class="n">${esc(payIcon(r.p) + ' ' + r.p.name)}${r.p.kind === 'card' ? ' <span class="rec-badge">카드</span>' : ''}</span><span class="v">${won(r.spent)}</span><span class="v">${r.bal == null ? '-' : (r.bal < 0 ? '-' : '') + won(Math.abs(r.bal))}</span></div>`).join('')}</div>
  ${tagRows.length ? `<div class="card"><h2>태그별 지출</h2>${tagRows.map(r => `<div class="lg"><span class="n">#${esc(r.g)}</span><span class="v">${won(r.v)}</span></div>`).join('')}</div>` : ''}`;
}

/* ---------- 예산 ---------- */
function budgetHTML() {
  const s = sums(ui.ym);
  const row = (id, label, spent) => {
    const b = budgetOf(id), r = b ? Math.min(spent / b, 1) : 0, st = budgetState(spent, b);
    return `<div class="brow"><div class="bhead"><span class="n">${label}</span><input type="text" inputmode="numeric" placeholder="예산 없음" data-bud="${id}" value="${b ? b.toLocaleString('ko-KR') : ''}"></div>
    ${b ? `<div class="bar ${st}"><i style="width:${r * 100}%"></i></div><div class="bsub"><span>${won(spent)} 사용 (${(spent / b * 100).toFixed(0)}%)</span><span>${b - spent >= 0 ? '남음 ' + won(b - spent) : '초과 ' + won(spent - b)}</span></div>` : `<div class="bsub"><span>${won(spent)} 사용</span><span></span></div>`}</div>`;
  };
  return `<div class="card"><h2>월 예산 (매달 같은 금액)</h2>${row('total', '💳 전체 예산', s.out)}</div>

}

/* ---------- 시트(입력 창) ---------- */
function setSheet(html) { $('sheetbox').innerHTML = html; $('sheet').classList.add('show'); }
function closeSheet() { $('sheet').classList.remove('show'); ui.f = null; }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

function newDraft(mode, t) {
  const first = type => (catsOf(type)[0] || {}).id || '';
  const d = t ? { ...t, tags: t.tags.slice() } : { type: 'out', amount: 0, date: ui.ym === monthOf(todayStr()) ? todayStr() : ui.ym + '-01', day: new Date().getDate(), cat: first('out'), pay: (live(S.pays)[0] || {}).id || '', memo: '', tags: [] };
  d.mode = mode; return d;
}
function syncForm() {
  const f = ui.f; if (!f) return;
  if ($('f-amount')) f.amount = num($('f-amount').value);
  if ($('f-date')) f.date = $('f-date').value || f.date;
  if ($('f-day')) f.day = +$('f-day').value;
  if ($('f-pay')) f.pay = $('f-pay').value;
  if ($('f-memo')) f.memo = $('f-memo').value.trim();
  if ($('f-tags')) f.tags = parseTags($('f-tags').value);
}
const parseTags = s => [...new Set(s.split(/[\s,#]+/).filter(Boolean))];
function txFormHTML() {
  const f = ui.f, isRec = f.mode === 'rec', editing = !!f.id;

function openTxForm(t) { ui.f = newDraft('tx', t); setSheet(txFormHTML()); if (!t) setTimeout(() => { const a = $('f-amount'); a && a.focus(); }, 50); }
function openRecForm(r) { ui.f = newDraft('rec', r); if (!r) ui.f.start = monthOf(todayStr()); setSheet(txFormHTML()); }

function saveForm() {
  syncForm(); const f = ui.f;
  if (!f.amount) { toast('금액을 입력해 주세요'); return; }
  if (!f.cat) { toast('카테고리를 선택해 주세요'); return; }
  if (!f.pay) { toast('결제수단을 먼저 추가해 주세요'); return; }
  if (f.mode === 'rec') {
    let r = f.id && S.rec.find(x => x.id === f.id);
    if (!r) { r = { id: uid(), start: f.start || monthOf(todayStr()) }; S.rec.push(r); }
    Object.assign(r, { type: f.type, amount: f.amount, day: f.day, cat: f.cat, pay: f.pay, memo: f.memo, tags: f.tags, d: 0 }); touch(r);
    save(); genRecurring(); closeSheet(); render(); toast('반복 거래를 저장했어요'); return;
  }
  let t = f.id && S.tx.find(x => x.id === f.id), isNew = !t;
  if (!t) { t = { id: uid() }; S.tx.push(t); }
  Object.assign(t, { type: f.type, amount: f.amount, date: f.date, cat: f.cat, pay: f.pay, memo: f.memo, tags: f.tags }); touch(t);
  save(); ui.ym = monthOf(t.date); closeSheet(); render();
  const note = isNew ? budgetNote(t) : ''; toast(note || '저장했어요');
}
function budgetNote(t) {
  if (t.type !== 'out') return '';
  const s = sums(monthOf(t.date)), msgs = [];
  [[t.cat, s.cat[t.cat] || 0, catName(t.cat)], ['total', s.out, '전체']].forEach(([id, sp, name]) => {
    const b = budgetOf(id); if (!b) return;
    const before = (sp - t.amount) / b, now = sp / b;
    if (before < 1 && now >= 1) msgs.push(`🚨 ${name} 예산을 넘었어요`); else if (before < .8 && now >= .8) msgs.push(`⚠️ ${name} 예산 80%에 도달했어요`);
  });
  return msgs.join(' ');
}

function openCatForm(c, type) {
  ui.f = c ? { mode: 'cat', id: c.id, type: c.type, name: c.name, emoji: c.emoji } : { mode: 'cat', type, name: '', emoji: type === 'in' ? '💰' : '🍚' };
  setSheet(catFormHTML());
}
function catFormHTML() {
  const f = ui.f;
  return `<h3>${f.id ? '카테고리 수정' : (f.type === 'out' ? '지출' : '수입') + ' 카테고리 추가'}</h3>
  <label class="l" for="f-name">이름</label><input class="inp" id="f-name" type="text" maxlength="12" value="${esc(f.name)}">
  <span class="l">아이콘</span>${emojiPickerHTML(f.type === 'in' ? { '수입·금융': EMOJI_GROUPS['수입·금융'], ...EMOJI_GROUPS } : EMOJI_GROUPS, f.emoji)}
  <div class="btnrow">${f.id ? '<button class="btn danger" data-act="fdelcat">삭제</button>' : ''}<button class="btn primary" data-act="fsavecat">저장</button></div>`;
}
function openPayForm(p) {
  ui.f = p ? { mode: 'pay', id: p.id, name: p.name, kind: p.kind, bal: payBalance(p), emoji: p.emoji || '' } : { mode: 'pay', name: '', kind: 'card', bal: 0, emoji: '' };
  setSheet(payFormHTML());
}
function payFormHTML() {
  const f = ui.f;
  return `<h3>${f.id ? '결제수단 수정' : '결제수단 추가'}</h3>
  <label class="l" for="f-name">이름</label><input class="inp" id="f-name" type="text" maxlength="14" placeholder="예: 신한카드" value="${esc(f.name)}">
  <span class="l">종류</span><div class="chips">${[['cash', '💵 현금'], ['bank', '🏦 계좌'], ['card', '💳 카드']].map(([k, n]) => `<button class="chip ${f.kind === k ? 'on' : ''}" data-act="fkind" data-k="${k}">${n}</button>`).join('')}</div>
  <span class="l">아이콘</span>${emojiPickerHTML(PAY_GROUPS, f.emoji || PAY_DEFAULT[f.kind])}
  ${f.kind !== 'card' ? `<label class="l" for="f-init">${f.id ? '현재 잔고' : '현재 잔고 (지금 가진 금액)'}</label><div class="ecustom" style="margin-top:0"><input class="inp amtinp" id="f-init" type="text" inputmode="numeric" value="${fmtN(f.bal)}" placeholder="0"><button class="btn" data-act="fsign" style="flex:0 0 auto">±</button></div><div class="hint">실제 잔고와 다르면 여기서 고치세요. 저장하면 기록된 내역은 그대로 두고, 시작 잔액이 자동으로 조정돼서 현재 잔고가 입력한 금액과 같아져요. 마이너스 잔고는 ± 버튼으로 입력해요.</div>` : '<div class="hint">카드는 잔액 대신 이번 달 사용액을 통계 탭에서 볼 수 있어요.</div>'}
  <div class="btnrow">${f.id ? '<button class="btn danger" data-act="fdelpay">삭제</button>' : ''}<button class="btn primary" data-act="fsavepay">저장</button></div>`;
}
function syncNameInit() { const f = ui.f; if ($('f-name')) f.name = $('f-name').value.trim(); if ($('f-init')) f.bal = numS($('f-init').value); }

function syncSheetHTML() {
  const link = SYNC_URL ? `${location.origin}${location.pathname}#sync=${encodeURIComponent(SYNC_URL)}` : '';
  return `<h3>구글 시트 동기화</h3>
  <div class="hint" style="margin:0 0 .5rem">ledger-apps-script.gs 파일의 설명대로 Apps Script 웹 앱을 만든 뒤, 발급된 URL을 아래에 붙여넣어 주세요.</div>
  <label class="l" for="sync-url">웹 앱 URL</label><input class="inp" type="text" id="sync-url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(SYNC_URL)}">
  <div class="btnrow"><button class="btn primary" data-act="syncSave">${SYNC_URL ? '저장하고 동기화' : '연결하기'}</button>${SYNC_URL ? '<button class="btn" data-act="syncNow">지금 동기화</button>' : ''}</div>
  ${SYNC_URL ? `<label class="l" for="sync-link">다른 기기 설정 링크</label><input class="inp" type="text" id="sync-link" readonly value="${esc(link)}"><div class="btnrow"><button class="btn" data-act="syncCopy">링크 복사</button><button class="btn danger" data-act="syncOff">연결 끊기</button></div><div class="hint">휴대폰 등 다른 기기에서 이 링크를 열면 같은 시트로 바로 연결돼요.</div>` : ''}`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset, f = ui.f;
  switch (d.act) {
    case 'tab': ui.tab = d.k; render(); window.scrollTo(0, 0); break;
    case 'prev': ui.ym = addMonth(ui.ym, -1); render(); break;
    case 'next': ui.ym = addMonth(ui.ym, 1); render(); break;
    case 'st': ui.st = d.k; render(); break;
    case 'ftoggle': ui.fopen = !ui.fopen; render(); break;
    case 'add': openTxForm(); break;
    case 'edit': openTxForm(S.tx.find(t => t.id === d.id)); break;
    case 'ftype': syncForm(); f.type = d.k; f.cat = (catsOf(d.k)[0] || {}).id || ''; setSheet(txFormHTML()); break;
    case 'fcat': syncForm(); f.cat = d.id; setSheet(txFormHTML()); break;
    case 'tagadd': { const inp = $('f-tags'), cur = parseTags(inp.value); if (!cur.includes(d.g)) cur.push(d.g); inp.value = cur.join(' '); break; }
    case 'fsave': saveForm(); break;
    case 'fdel': if (confirm(f.mode === 'rec' ? '이 반복 거래를 삭제할까요? (이미 기록된 내역은 남아요)' : '이 내역을 삭제할까요?')) {
      const arr = f.mode === 'rec' ? S.rec : S.tx, o = arr.find(x => x.id === f.id); if (o) { o.d = 1; touch(o); } save(); closeSheet(); render(); toast('삭제했어요');
    } break;
    case 'addRec': openRecForm(); break;
    case 'editRec': openRecForm(S.rec.find(r => r.id === d.id)); break;
    case 'addCat': openCatForm(null, d.t); break;
    case 'editCat': openCatForm(catById(d.id)); break;
    case 'femoji': {   // 다시 그리지 않고 선택 표시만 바꿔서 스크롤 위치를 유지
      f.emoji = d.e; document.querySelectorAll('.eb.on').forEach(x => x.classList.remove('on')); el.classList.add('on');
      $('f-eprev').textContent = d.e; $('f-ecustom').value = ''; break;
    }
    case 'fsavecat': {
      syncNameInit(); if (!f.name) { toast('이름을 입력해 주세요'); break; }
      let c = f.id && catById(f.id);
      if (!c) { c = { id: uid(), type: f.type, color: catsOf(f.type).length % PALETTE.length }; S.cats.push(c); }
      c.name = f.name; c.emoji = f.emoji; c.d = 0; touch(c); save(); closeSheet(); render(); toast('저장했어요'); break;
    }
    case 'fdelcat': if (catsOf(f.type).length <= 1) { toast('카테고리는 최소 1개 필요해요'); break; }
      if (confirm('이 카테고리를 삭제할까요? 기존 내역은 그대로 남아요.')) { const c = catById(f.id); c.d = 1; touch(c); save(); closeSheet(); render(); toast('삭제했어요'); } break;
    case 'addPay': openPayForm(); break;
    case 'editPay': openPayForm(payById(d.id)); break;
    case 'fsign': { const inp = $('f-init'), n = -numS(inp.value); inp.value = fmtN(n); f.bal = n; break; }
    case 'fkind': syncNameInit(); f.kind = d.k; setSheet(payFormHTML()); break;
    case 'fsavepay': {
      syncNameInit(); if (!f.name) { toast('이름을 입력해 주세요'); break; }
      let p = f.id && payById(f.id); if (!p) { p = { id: uid() }; S.pays.push(p); }
      p.name = f.name; p.kind = f.kind; p.emoji = f.emoji; p.d = 0; p.init = 0; if (f.kind !== 'card') p.init = f.bal - payNet(p.id);   // 현재 잔고가 입력값과 같아지도록 시작 잔액 조정
 touch(p); save(); closeSheet(); render(); toast('저장했어요'); break;
    }
    case 'fdelpay': if (live(S.pays).length <= 1) { toast('결제수단은 최소 1개 필요해요'); break; }
      if (confirm('이 결제수단을 삭제할까요? 기존 내역은 그대로 남아요.')) { const p = payById(f.id); p.d = 1; touch(p); save(); closeSheet(); render(); toast('삭제했어요'); } break;
    case 'sync': setSheet(syncSheetHTML()); break;
    case 'syncSave': {
      const u = $('sync-url').value.trim();
      if (!u.startsWith('https://script.google.com/')) { toast('구글 Apps Script 웹 앱 URL(https://script.google.com/…)을 넣어 주세요'); break; }
      SYNC_URL = u; lsSet(LS_URL, u); setSheet(syncSheetHTML()); render(); pullSync(true); break;
    }
    case 'syncNow': pullSync(true); break;
    case 'syncCopy': { const el2 = $('sync-link'); el2.select(); (navigator.clipboard ? navigator.clipboard.writeText(el2.value) : Promise.reject()).then(() => toast('링크를 복사했어요'), () => toast('링크를 길게 눌러 복사해 주세요')); break; }
    case 'syncOff': if (confirm('동기화 연결을 끊을까요? 이 기기의 기록은 그대로 남아요.')) { SYNC_URL = ''; lsSet(LS_URL, ''); lsSet(LS_BASE, '0'); setSync(''); closeSheet(); render(); toast('연결을 끊었어요'); } break;
    case 'reset': if (confirm('정말 모든 기록을 지우고 처음으로 되돌릴까요? 되돌릴 수 없어요.')) { lsSet(LS_BACKUP, JSON.stringify(S)); S = blank(); save(); render(); toast('초기화했어요'); } break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value; renderList(); }
  if (t.id === 'f-ecustom' && ui.f) {   // 직접 입력한 이모지(첫 글자만 사용)
    const c = firstChar(t.value); if (!c) return;
    ui.f.emoji = c; t.value = c; $('f-eprev').textContent = c; document.querySelectorAll('.eb.on').forEach(x => x.classList.remove('on'));
  }
  if (t.id === 'f-init') {   // 잔고: 마이너스 허용
    const n = numS(t.value), neg = /^[-−–]/.test(t.value.trim());
    t.value = n ? fmtN(n) : (neg ? '-' : ''); return;
  }
  if (t.id === 'f-amount' || (t.dataset && t.dataset.bud)) {   // 숫자 입력칸: 천 단위 쉼표 표시
    const n = num(t.value); t.value = n ? n.toLocaleString('ko-KR') : '';
    if (t.id === 'f-amount') $('f-amtview').textContent = n ? won(n) : '';
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.filter) { ui[t.dataset.filter] = t.value; render(); }
  if (t.dataset && t.dataset.bud) { setBudget(t.dataset.bud, num(t.value)); render(); toast('예산을 저장했어요'); }
});

/* ---------- 구글 시트 동기화 ---------- */
function setSync(msg, err) { const el = $('sync'); el.textContent = msg; el.className = 'sync' + (err ? ' error' : ''); }
let pushTimer = null;
function schedulePush() { if (!SYNC_URL) return; clearTimeout(pushTimer); setSync('저장 대기 중...'); pushTimer = setTimeout(pullSync, 1500); }   // 올리기 전에 시트를 먼저 확인해 다른 기기의 변경과 합침
async function pushNow() {
  if (!SYNC_URL) return;
  clearTimeout(pushTimer); pushTimer = null; setSync('시트에 저장 중...');
  try {
    const stamp = S.updatedAt;
    await fetch(SYNC_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'save', state: S }) });
    lsSet(LS_BASE, String(stamp)); if (S.updatedAt === stamp) lsSet(LS_DIRTY, '0');
    setSync('시트에 저장됨 ✓'); setTimeout(() => setSync(''), 2000);
  } catch (e) { setSync('시트 저장 실패 (이 기기에는 저장됨)', true); }
}
// a: 이 기기, b: 시트. 항목별로 더 늦게 수정한 쪽을 쓴다(삭제도 수정으로 취급)
function mergeStates(a, b) {
  const m = { ...b, ...a };
  ['tx', 'cats', 'pays', 'budgets', 'rec'].forEach(k => {
    const map = new Map();
    [...(b[k] || []), ...(a[k] || [])].forEach(x => { const o = map.get(x.id); if (!o || (x.u || 0) >= (o.u || 0)) map.set(x.id, x); });
    m[k] = [...map.values()];
  });
  return m;
}
async function pullSync(manual) {
  if (!SYNC_URL) return;
  clearTimeout(pushTimer); pushTimer = null;
  setSync('불러오는 중...');
  try {
    const res = await fetch(`${SYNC_URL}?action=load`), data = await res.json(), remote = data && data.state;
    if (!remote || !Array.isArray(remote.tx)) { await pushNow(); return; }      // 시트가 비어 있으면 이 기기 기록을 올림
    norm(remote);
    const base = +(lsGet(LS_BASE) || 0), dirty = lsGet(LS_DIRTY) === '1', ru = remote.updatedAt || 0;
    if (ru > base) {                                                              // 다른 기기에서 바뀜
      lsSet(LS_BACKUP, JSON.stringify(S));                                        // 덮어쓰기 전 이 기기 기록을 따로 보관
      if (dirty || !S.updatedAt) { S = norm(mergeStates(S, remote)); S.updatedAt = Date.now(); saveLocal(); genRecurring(); render(); await pushNow(); if (manual) toast('두 기기의 기록을 합쳤어요'); }
      else { S = remote; saveLocal(); lsSet(LS_BASE, String(ru)); setSync(''); genRecurring(); render(); if (manual) toast('시트의 기록을 불러왔어요'); }
    } else if (dirty) await pushNow();
    else { setSync(''); if (manual) toast('이미 최신 상태예요 ✓'); }
  } catch (e) { setSync('시트 불러오기 실패. 이 기기의 기록을 보여드려요', true); }
}
(function () {   // 다른 기기용 설정 링크(#sync=...)로 열면 바로 연결
  SYNC_URL = lsGet(LS_URL) || '';
  const m = location.hash.match(/^#sync=(.+)$/);
  if (m) { try { const u = decodeURIComponent(m[1]); if (u.startsWith('https://script.google.com/')) { SYNC_URL = u; lsSet(LS_URL, u); history.replaceState(null, '', location.pathname + location.search); } } catch (e) {} }
})();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  genRecurring(); if (!$('sheet').classList.contains('show')) render();
  if (SYNC_URL && !pushTimer) pullSync();       // 앱으로 돌아오면 다른 기기의 변경을 가져옴
});

genRecurring();
render();
if (SYNC_URL) pullSync();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

</html>
